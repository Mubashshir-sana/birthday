name: Deploy birthday app to GitHub Pages

on:
  push:
    paths:
      - "birthday-site/**"
      - ".github/workflows/birthday-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: birthday-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload birthday app
        uses: actions/upload-pages-artifact@v3
        with:
          path: birthday-site

      - name: Deploy birthday app
        id: deployment
        uses: actions/deploy-pages@v4
